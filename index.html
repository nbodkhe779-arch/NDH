<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NDH - Nicks Design Hub</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      text-align: center;
    }

    input, select {
      padding: 10px;
      margin: 5px;
      width: 200px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }

    #dashboard {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>NDH - Design Hub</h1>

<!-- AUTH SECTION -->
<div id="authSection">

  <h2>Login / Signup</h2>

  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>

  <select id="role">
    <option value="customer">Customer</option>
    <option value="creator">Creator</option>
  </select><br>

  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <h2>Welcome to NDH</h2>

  <button onclick="logout()">Logout</button>

  <div id="creatorPanel">
    <h3>Add Service</h3>

    <input id="title" placeholder="Title"><br>
    <input id="price" placeholder="Price"><br>
    <input id="image" placeholder="Image URL"><br>
    <input id="description" placeholder="Description"><br>

    <button onclick="addService()">Add Service</button>
  </div>

  <h3>Services</h3>
  <div id="servicesList"></div>

</div>

<!-- JS FILE -->
<script src="app.js"></script>

</body>
</html>
